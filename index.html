<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClueSearch</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe4;
      --card: #f8f2e6;
      --text: #3f2223;
      --border: #6b4a4c;
      --button: #ead9bd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap {
      width: min(92vw, 560px);
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 28px 22px;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: 0.4px;
    }
    p {
      margin: 0 0 20px;
      opacity: 0.88;
    }
    .actions {
      display: grid;
      gap: 10px;
    }
    a.btn {
      display: block;
      text-decoration: none;
      color: var(--text);
      background: var(--button);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-weight: 700;
    }
    a.btn:hover { filter: brightness(0.98); }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>ClueSearch</h1>
    <p>Official links and support pages</p>
    <div class="actions">
      <a class="btn" href="/privacy-policy">Privacy Policy</a>
      <a class="btn" href="/terms-of-use">Terms of Use</a>
      <a class="btn" href="/support">Support</a>
    </div>
  </main>
</body>
</html>
